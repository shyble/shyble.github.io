---
layout: default
---

<article class="post">
    <h1>{{ page.title }}</h1>
    <div class="post-date">{{ page.date | date: "%B %d, %Y" }}</div>
    {{ content }}
    {% if page.tags.size > 0 %}
    <div class="post-tags" style="margin-top: 2.5rem;">
        {% for tag in page.tags %}
        <a class="tag" href="/blog/#{{ tag | slugify }}">{{ tag }}</a>
        {% endfor %}
    </div>
    {% endif %}
</article>

{% if page.comments != false %}
<section class="comments" style="margin-top: 3rem; border-top: 1px solid var(--border); padding-top: 2rem;">
    <h2 style="border: none; margin-bottom: 1rem;">Comments &amp; reactions</h2>
    <script src="https://giscus.app/client.js"
            data-repo="shyble/shyble.github.io"
            data-repo-id="R_kgDORzM-3w"
            data-category="Announcements"
            data-category-id="DIC_kwDORzM-384C_MPe"
            data-mapping="pathname"
            data-strict="0"
            data-reactions-enabled="1"
            data-emit-metadata="0"
            data-input-position="bottom"
            data-theme="dark"
            data-lang="en"
            data-loading="lazy"
            crossorigin="anonymous"
            async>
    </script>
</section>
{% endif %}
